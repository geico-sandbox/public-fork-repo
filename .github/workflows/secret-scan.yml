name: secret_scan

on:
  pull_request:
  push:

jobs:
  secretScan:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --results=unverified,unknown